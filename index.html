<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brico-Match - Plateforme Bricolage & Artisans</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Header / Navbar -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" id="navLogo">
        <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-slate-950 font-black text-xl">BM</div>
        <span class="text-xl font-bold tracking-tight text-white">Brico-<span class="text-emerald-500">Match</span></span>
      </div>

      <div id="userInfoNav" class="hidden flex items-center gap-4">
        <span id="userBadge" class="text-xs px-2.5 py-1 rounded-full font-bold bg-slate-800 text-slate-300 border border-slate-700">Guest</span>
        <span id="userEmailNav" class="text-sm font-medium text-slate-300"></span>
        <button id="logoutBtn" class="text-xs px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg transition">Déconnexion</button>
      </div>
    </div>
  </header>

  <!-- Global Alert Box -->
  <div class="max-w-7xl mx-auto px-4 mt-4 w-full">
    <div id="globalAlert" class="hidden p-4 rounded-xl text-sm font-medium border shadow-lg transition-all"></div>
  </div>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">

    <!-- VIEW 1: AUTHENTICATION (Login / Register) -->
    <section id="viewAuth" class="max-w-md mx-auto my-8">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl">
        
        <!-- Auth Tabs -->
        <div class="flex border-b border-slate-800 mb-6">
          <button id="tabRegister" class="flex-1 pb-3 text-center font-bold border-b-2 border-emerald-500 text-emerald-400">Inscription</button>
          <button id="tabLogin" class="flex-1 pb-3 text-center font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200">Connexion</button>
        </div>

        <!-- Register Form -->
        <form id="formRegister" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Nom Complet</label>
            <input type="text" id="regFullName" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-emerald-500 focus:outline-none text-slate-100" placeholder="Karim Benali">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Email</label>
            <input type="email" id="regEmail" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-emerald-500 focus:outline-none text-slate-100" placeholder="exemple@mail.com">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Mot de passe</label>
            <input type="password" id="regPassword" required minlength="6" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-emerald-500 focus:outline-none text-slate-100" placeholder="••••••••">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Rôle</label>
            <select id="regRole" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-emerald-500 focus:outline-none text-slate-100">
              <option value="client">Client (Je cherche un artisan)</option>
              <option value="artisan">Artisan / Bricoleur (Je propose mes services)</option>
            </select>
          </div>

          <div id="artisanSpecialtyGroup" class="hidden">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Spécialité</label>
            <select id="regSpecialty" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-emerald-500 focus:outline-none text-slate-100">
              <option value="Plomberie">Plomberie</option>
              <option value="Électricité">Électricité</option>
              <option value="Peinture">Peinture</option>
              <option value="Menuiserie">Menuiserie</option>
              <option value="Climatisation">Climatisation / HVAC</option>
              <option value="Autre">Autre Service</option>
            </select>
          </div>

          <button type="submit" id="btnRegisterSubmit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-emerald-950/50 mt-2">
            Créer un compte
          </button>
        </form>

        <!-- Login Form -->
        <form id="formLogin" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Email</label>
            <input type="email" id="loginEmail" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-emerald-500 focus:outline-none text-slate-100" placeholder="exemple@mail.com">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Mot de passe</label>
            <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-emerald-500 focus:outline-none text-slate-100" placeholder="••••••••">
          </div>

          <button type="submit" id="btnLoginSubmit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-emerald-950/50 mt-2">
            Se Connecter
          </button>
        </form>

      </div>
    </section>

    <!-- VIEW 2: CLIENT DASHBOARD -->
    <section id="viewClient" class="hidden space-y-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <div>
          <h1 class="text-2xl font-bold text-white">Espace Client</h1>
          <p class="text-sm text-slate-400">Publiez des demandes de travaux et gérez vos demandes en cours.</p>
        </div>
        <button id="btnOpenNewJobModal" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl transition flex items-center gap-2">
          <span>+ Publier une demande</span>
        </button>
      </div>

      <!-- Posted Jobs List -->
      <div class="space-y-4">
        <h2 class="text-lg font-bold text-slate-200">Mes Demandes Publiées</h2>
        <div id="clientJobsList" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
          <!-- Dynamically Injected -->
        </div>
      </div>
    </section>

    <!-- VIEW 3: ARTISAN DASHBOARD -->
    <section id="viewArtisan" class="hidden space-y-6">
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <h1 class="text-2xl font-bold text-white">Espace Artisan / Bricoleur</h1>
        <p class="text-sm text-slate-400">Parcourez les offres de travaux disponibles et postulez directement.</p>
      </div>

      <!-- Available Jobs List -->
      <div class="space-y-4">
        <h2 class="text-lg font-bold text-slate-200">Offres de Travaux Disponibles</h2>
        <div id="artisanJobsList" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
          <!-- Dynamically Injected -->
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL: NEW JOB POST -->
  <div id="modalJob" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative">
      <h3 class="text-xl font-bold text-white mb-4">Nouvelle Demande de Service</h3>
      
      <form id="formNewJob" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Titre de la demande</label>
          <input type="text" id="jobTitle" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-emerald-500 focus:outline-none text-slate-100" placeholder="Ex: Réparation fuite d'eau cuisine">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Catégorie</label>
          <select id="jobCategory" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-emerald-500 focus:outline-none text-slate-100">
            <option value="Plomberie">Plomberie</option>
            <option value="Électricité">Électricité</option>
            <option value="Peinture">Peinture</option>
            <option value="Menuiserie">Menuiserie</option>
            <option value="Climatisation">Climatisation / HVAC</option>
            <option value="Autre">Autre Service</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Wilaya / Ville</label>
          <input type="text" id="jobLocation" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-emerald-500 focus:outline-none text-slate-100" placeholder="Ex: Bordj Bou Arreridj / Alger">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Description détaillée</label>
          <textarea id="jobDescription" rows="3" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-emerald-500 focus:outline-none text-slate-100" placeholder="Décrivez clairement le travail demandé..."></textarea>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" id="btnCloseJobModal" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition">Annuler</button>
          <button type="submit" id="btnSubmitJob" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl transition">Publier</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Scripts (Modular v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      get, 
      push, 
      onValue 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Your Exact Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBTlrCFNqiMBAgemAVPmbIQ87mAoTDibSs",
      authDomain: "brico-match.firebaseapp.com",
      projectId: "brico-match",
      storageBucket: "brico-match.firebasestorage.app",
      messagingSenderId: "576015588951",
      appId: "1:576015588951:web:695db99916c5c42df80d12",
      measurementId: "G-QYEVVXHCSL"
    };

    // Explicit Database URL targeting Europe-West1 Regional Node
    const RTDB_URL = "https://brico-match-default-rtdb.europe-west1.firebasedatabase.app";

    // Initialize Firebase Services
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app, RTDB_URL);

    // App State
    let currentUser = null;
    let currentUserProfile = null;

    // DOM Elements
    const globalAlert = document.getElementById("globalAlert");
    const viewAuth = document.getElementById("viewAuth");
    const viewClient = document.getElementById("viewClient");
    const viewArtisan = document.getElementById("viewArtisan");
    const userInfoNav = document.getElementById("userInfoNav");
    const userBadge = document.getElementById("userBadge");
    const userEmailNav = document.getElementById("userEmailNav");
    const logoutBtn = document.getElementById("logoutBtn");

    // Auth Form Elements
    const tabRegister = document.getElementById("tabRegister");
    const tabLogin = document.getElementById("tabLogin");
    const formRegister = document.getElementById("formRegister");
    const formLogin = document.getElementById("formLogin");
    const regRole = document.getElementById("regRole");
    const artisanSpecialtyGroup = document.getElementById("artisanSpecialtyGroup");

    // Modal Elements
    const modalJob = document.getElementById("modalJob");
    const btnOpenNewJobModal = document.getElementById("btnOpenNewJobModal");
    const btnCloseJobModal = document.getElementById("btnCloseJobModal");
    const formNewJob = document.getElementById("formNewJob");

    // UI Helper Functions
    function showAlert(msg, type = "error") {
      globalAlert.textContent = msg;
      globalAlert.className = `p-4 rounded-xl text-sm font-medium border shadow-lg transition-all block ${
        type === "error" 
          ? "bg-red-500/10 text-red-400 border-red-500/30" 
          : "bg-emerald-500/10 text-emerald-400 border-emerald-500/30"
      }`;
      setTimeout(() => { globalAlert.classList.add("hidden"); }, 5000);
    }

    function switchView(viewName) {
      viewAuth.classList.add("hidden");
      viewClient.classList.add("hidden");
      viewArtisan.classList.add("hidden");

      if (viewName === "auth") viewAuth.classList.remove("hidden");
      if (viewName === "client") viewClient.classList.remove("hidden");
      if (viewName === "artisan") viewArtisan.classList.remove("hidden");
    }

    // Toggle Role-Specific Specialty Input
    regRole.addEventListener("change", (e) => {
      if (e.target.value === "artisan") {
        artisanSpecialtyGroup.classList.remove("hidden");
      } else {
        artisanSpecialtyGroup.classList.add("hidden");
      }
    });

    // Toggle Auth Tabs
    tabRegister.addEventListener("click", () => {
      tabRegister.className = "flex-1 pb-3 text-center font-bold border-b-2 border-emerald-500 text-emerald-400";
      tabLogin.className = "flex-1 pb-3 text-center font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200";
      formRegister.classList.remove("hidden");
      formLogin.classList.add("hidden");
    });

    tabLogin.addEventListener("click", () => {
      tabLogin.className = "flex-1 pb-3 text-center font-bold border-b-2 border-emerald-500 text-emerald-400";
      tabRegister.className = "flex-1 pb-3 text-center font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200";
      formLogin.classList.remove("hidden");
      formRegister.classList.add("hidden");
    });

    // Auth State Listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        try {
          const snapshot = await get(ref(database, `users/${user.uid}`));
          if (snapshot.exists()) {
            currentUserProfile = snapshot.val();
            
            // Update Header Nav
            userInfoNav.classList.remove("hidden");
            userEmailNav.textContent = currentUserProfile.fullName || user.email;
            userBadge.textContent = currentUserProfile.role.toUpperCase();

            // Redirect based on role
            if (currentUserProfile.role === "client") {
              switchView("client");
              listenToClientJobs();
            } else {
              switchView("artisan");
              listenToAllJobs();
            }
          } else {
            showAlert("Profil utilisateur introuvable dans la base de données.", "error");
          }
        } catch (err) {
          console.error("User Profile Error:", err);
          showAlert("Erreur lors de la récupération du profil: " + err.message, "error");
        }
      } else {
        currentUser = null;
        currentUserProfile = null;
        userInfoNav.classList.add("hidden");
        switchView("auth");
      }
    });

    // Handle Registration
    formRegister.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnRegisterSubmit");
      btn.disabled = true;
      btn.textContent = "Création en cours...";

      const fullName = document.getElementById("regFullName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const role = regRole.value;
      const specialty = role === "artisan" ? document.getElementById("regSpecialty").value : "";

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        // Write profile to Realtime Database
        await set(ref(database, `users/${uid}`), {
          uid,
          fullName,
          email,
          role,
          specialty,
          createdAt: new Date().toISOString()
        });

        showAlert("Compte créé avec succès!", "success");
      } catch (err) {
        console.error("Registration Error:", err);
        showAlert(err.message || "Erreur lors de l'inscription.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Créer un compte";
      }
    });

    // Handle Login
    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnLoginSubmit");
      btn.disabled = true;
      btn.textContent = "Connexion en cours...";

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showAlert("Connexion réussie!", "success");
      } catch (err) {
        console.error("Login Error:", err);
        showAlert("Échec de connexion: " + err.message, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Se Connecter";
      }
    });

    // Logout
    logoutBtn.addEventListener("click", () => signOut(auth));

    // Modal Operations
    btnOpenNewJobModal.addEventListener("click", () => modalJob.classList.remove("hidden"));
    btnCloseJobModal.addEventListener("click", () => modalJob.classList.add("hidden"));

    // Handle Posting New Job (Client)
    formNewJob.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnSubmitJob");
      btn.disabled = true;

      const title = document.getElementById("jobTitle").value.trim();
      const category = document.getElementById("jobCategory").value;
      const location = document.getElementById("jobLocation").value.trim();
      const description = document.getElementById("jobDescription").value.trim();

      try {
        const newJobRef = push(ref(database, 'jobs'));
        await set(newJobRef, {
          id: newJobRef.key,
          clientId: currentUser.uid,
          clientName: currentUserProfile.fullName || currentUser.email,
          title,
          category,
          location,
          description,
          status: 'open',
          createdAt: new Date().toISOString()
        });

        showAlert("Demande publiée avec succès!", "success");
        formNewJob.reset();
        modalJob.classList.add("hidden");
      } catch (err) {
        console.error("Job Post Error:", err);
        showAlert("Erreur de publication: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });

    // Listeners for Realtime Database Updates
    function listenToClientJobs() {
      const clientJobsList = document.getElementById("clientJobsList");
      onValue(ref(database, 'jobs'), (snapshot) => {
        clientJobsList.innerHTML = "";
        if (!snapshot.exists()) {
          clientJobsList.innerHTML = `<p class="text-slate-500 text-sm col-span-full">Aucune demande publiée pour le moment.</p>`;
          return;
        }

        const jobs = snapshot.val();
        let myJobsCount = 0;

        Object.values(jobs).forEach(job => {
          if (job.clientId === currentUser.uid) {
            myJobsCount++;
            const card = document.createElement("div");
            card.className = "bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between";
            card.innerHTML = `
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-bold px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg">${job.category}</span>
                  <span class="text-xs text-slate-500">${new Date(job.createdAt).toLocaleDateString('fr-FR')}</span>
                </div>
                <h3 class="font-bold text-white mb-1">${job.title}</h3>
                <p class="text-xs text-slate-400 mb-3">${job.location}</p>
                <p class="text-sm text-slate-300 line-clamp-3">${job.description}</p>
              </div>
            `;
            clientJobsList.appendChild(card);
          }
        });

        if (myJobsCount === 0) {
          clientJobsList.innerHTML = `<p class="text-slate-500 text-sm col-span-full">Vous n'avez pas encore publié de demande.</p>`;
        }
      });
    }

    function listenToAllJobs() {
      const artisanJobsList = document.getElementById("artisanJobsList");
      onValue(ref(database, 'jobs'), (snapshot) => {
        artisanJobsList.innerHTML = "";
        if (!snapshot.exists()) {
          artisanJobsList.innerHTML = `<p class="text-slate-500 text-sm col-span-full">Aucune offre de travail disponible.</p>`;
          return;
        }

        const jobs = snapshot.val();
        Object.values(jobs).forEach(job => {
          const card = document.createElement("div");
          card.className = "bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between";
          card.innerHTML = `
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg">${job.category}</span>
                <span class="text-xs text-slate-500">${new Date(job.createdAt).toLocaleDateString('fr-FR')}</span>
              </div>
              <h3 class="font-bold text-white mb-1">${job.title}</h3>
              <p class="text-xs text-slate-400 mb-2">📍 ${job.location} • Client: ${job.clientName}</p>
              <p class="text-sm text-slate-300 mb-4">${job.description}</p>
            </div>
            <button onclick="alert('Demande de contact envoyée au client!')" class="w-full py-2 bg-slate-800 hover:bg-emerald-600 hover:text-slate-950 text-emerald-400 font-bold rounded-xl transition text-sm">
              Postuler à cette offre
            </button>
          `;
          artisanJobsList.appendChild(card);
        });
      });
    }
  </script>
</body>
</html>
